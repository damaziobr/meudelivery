<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeuDelivery — Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#ff5a1f;--brand-d:#e2460f;--brand-l:#fff1eb;--ink:#1b1d22;--muted:#6b7280;--line:#e6e7eb;--bg:#f4f5f7;--card:#fff;--ok:#16a34a;--ok-l:#e8f7ee;--warn:#c26a00;--warn-l:#fff4dc;--info:#2563eb;--info-l:#eaf1ff;--bad:#dc2626;--bad-l:#fdecec;--side:#15171c;--wa:#075e54;--wabg:#efe7de}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-d);cursor:pointer;font-weight:600;text-decoration:underline}
h1,h2,h3,h4{letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);color:#cfd3dc;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:4px 8px 10px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:18px}
.nav-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7d8391;margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left;color:#cfd3dc}
.nav:hover{background:#22252c}
.nav.on{background:var(--brand);color:#fff}
.nav .bd{margin-left:auto;background:#ff3b30;color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.nav.on .bd{background:#fff;color:var(--brand)}
.side-foot{margin:22px 10px 0;font-size:11.5px;color:#6f7582;line-height:1.4}
.main{flex:1;min-width:0;padding:24px 28px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top>div:first-child{margin-right:auto}
.top h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:3px 0 0;font-size:13px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.h3{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:#c9ccd3}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:3px 9px;font-size:11.5px;font-weight:600;background:#eef0f3;color:#3b3f48;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.warn{background:var(--warn-l);color:var(--warn)}.pill.info{background:var(--info-l);color:var(--info)}.pill.bad{background:var(--bad-l);color:var(--bad)}.pill.br{background:var(--brand-l);color:var(--brand-d)}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#cfd3da;border-radius:20px;transition:.2s}
.sw span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw.warn input:checked+span{background:#f59e0b}
.sw input:checked+span:before{transform:translateX(16px)}
.tg{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2x{grid-template-columns:1.4fr 1fr}
.row{display:flex;align-items:center}.sb{justify-content:space-between}.g8{gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:16px}.m0{margin:0}.pad{padding:16px}.center{text-align:center}
.muted{color:var(--muted)}.green{color:var(--ok)}.warn-t{color:var(--warn)}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ok);margin-top:2px;font-weight:600}
.note{background:#f7f8fa;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px;line-height:1.45}
.tip{background:var(--brand-l);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:14px;line-height:1.45}
.ck{padding-left:0;list-style:none;margin:0}
.ck li{padding:6px 0 6px 26px;position:relative;line-height:1.45}
.ck li:before{content:'✓';position:absolute;left:0;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ok-l);color:var(--ok);font-size:11px;display:grid;place-items:center;font-weight:800}
.code{font-family:ui-monospace,Consolas,monospace;background:#f1f2f5;border-radius:5px;padding:1px 6px;font-size:12.5px}
.linkbox{font-family:ui-monospace,Consolas,monospace;background:#f1f2f5;border-radius:8px;padding:10px 12px;font-size:13px;word-break:break-all}
.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:0}
.inp:focus{border-color:var(--brand)}
.lb{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.empty{color:#9aa0aa;font-size:12.5px;text-align:center;padding:20px 6px}
/* início */
.hero{background:linear-gradient(135deg,#1b1d22,#2b2118);color:#fff;border-radius:20px;padding:34px;display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:center;margin-bottom:26px}
.hero h1{font-size:32px;line-height:1.15;margin:14px 0 12px}
.hero h1 span{color:#ff8a5c}
.hero p{color:#c9ccd3;font-size:15px;line-height:1.55;margin:0 0 20px}
.hero .pill{background:#ffffff1a;color:#ffd2bf}
.hs{display:grid;gap:10px}
.hs div{background:#ffffff12;border:1px solid #ffffff1c;border-radius:14px;padding:14px 16px}
.hs b{font-size:24px;display:block;color:#fff}
.hs span{color:#bfc3cc;font-size:13px}
.sec-t{font-size:18px;margin:6px 0 12px}
.step{display:flex;gap:12px}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.step p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.tile{cursor:pointer;transition:.15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px)}
.tile .e{font-size:28px}
.tile b{display:block;margin:8px 0 4px;font-size:15px}
.tile span{color:var(--muted);font-size:13px;line-height:1.45}
.plan{position:relative}
.plan.dest{border:2px solid var(--brand)}
.plan .pr{font-size:28px;font-weight:800;margin:6px 0}
.plan .pr small{font-size:13px;color:var(--muted);font-weight:500}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceef2;border-radius:12px;padding:10px;min-height:420px}
.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.col h3 span{background:#fff;border-radius:20px;padding:1px 8px;font-size:12px}
.col-analise h3{color:var(--warn)}.col-preparo h3{color:var(--info)}.col-pronto h3{color:#7c3aed}.col-entrega h3{color:var(--brand-d)}.col-finalizado h3{color:var(--ok)}
.oc{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.oc:hover{border-color:#cdd0d6}
.oc.fresh{border-color:var(--brand);box-shadow:0 0 0 3px #ff5a1f33;animation:pop .5s}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.oc-h{display:flex;align-items:center;gap:6px}
.oc-h .tm{margin-left:auto;font-size:11.5px;color:var(--muted)}
.oc-h .tm.late{color:var(--bad);font-weight:700}
.oc-n{font-weight:600;margin-top:6px}
.oc-i{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.oc-m{font-size:12px;margin-top:5px;color:var(--brand-d);font-weight:600}
.oc-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px}
.oc-f span{color:var(--muted);text-align:right;max-width:60%}
.oc-a{display:flex;gap:6px;margin-top:10px}
.oc-a .btn{flex:1}
.col-finalizado .oc{opacity:.75}
/* celular */
.phone-wrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:370px;max-width:100%;height:760px;background:#111;border-radius:46px;padding:11px;box-shadow:0 24px 60px rgba(0,0,0,.2);flex-shrink:0}
.screen{background:#fff;border-radius:36px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;position:relative}
.explain{flex:1;min-width:280px;max-width:520px}
/* cardápio */
.cv-hero{height:118px;background:linear-gradient(135deg,#ff8a3d,#e8331f);position:relative;flex-shrink:0}
.cv-hero:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffff40,transparent 50%)}
.cv-logo{position:absolute;left:16px;bottom:-30px;width:66px;height:66px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:0 6px 16px rgba(0,0,0,.15);z-index:1}
.cv-info{padding:38px 16px 8px}
.cv-info h2{margin:0 0 6px;font-size:20px}
.cv-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.cv-cb{background:#fff7e6;color:#8a5a00;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.cv-closed{margin:6px 16px;background:var(--bad-l);color:var(--bad);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600}
.bn{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none}
.bn div{min-width:240px;height:92px;border-radius:14px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bn div span{position:absolute;right:10px;top:4px;font-size:46px;opacity:.9}
.bn b{font-size:16px}.bn small{opacity:.9}
.cv-cat{font-weight:800;font-size:15px;padding:16px 16px 4px}
.dest{display:flex;gap:10px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none}
.dc{min-width:128px;cursor:pointer}
.dc .im{height:96px;border-radius:12px;display:grid;place-items:center;font-size:44px}
.dc b{display:block;font-size:12.5px;margin-top:6px}
.dc span{font-size:12.5px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid var(--line);margin-top:8px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pi{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f0f1f3;cursor:pointer}
.pi:hover{background:#fafafa}
.pi .tx{flex:1;min-width:0}
.pi .im{width:82px;height:82px;border-radius:12px;display:grid;place-items:center;font-size:40px;flex-shrink:0}
.pi h4{margin:0 0 3px;font-size:14px}
.pi p{margin:0;color:var(--muted);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi.off{opacity:.5;cursor:default}
.price{font-weight:700;margin-top:6px;font-size:13.5px}
.de{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:12px;margin-right:5px}
.bag{position:absolute;left:12px;right:12px;bottom:14px;background:var(--brand);color:#fff;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;font-weight:700;border:0;box-shadow:0 8px 20px #ff5a1f55;z-index:5}
.pd-im{height:210px;display:grid;place-items:center;font-size:96px;position:relative}
.back{position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pd-n{margin:0 0 6px;font-size:20px}
.big2{font-size:22px;font-weight:800;margin:8px 0}
.pd-sec{font-weight:700;margin:18px 0 8px;font-size:13.5px}
.pd-sec small{font-weight:500;color:var(--muted);margin-left:6px}
.opt{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:13px}
.opt span:first-child{flex:1}
.opt input{accent-color:var(--brand);width:18px;height:18px}
.opt.pay small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.opt.pay.on{border-color:var(--brand);background:var(--brand-l)}
.pd-foot{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px 18px;display:flex;gap:10px;align-items:center;z-index:5}
.pd-foot .btn{padding:12px}
.qty{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.qty button{width:28px;height:28px;border:0;background:#f3f4f6;border-radius:8px;font-size:16px;font-weight:700;color:var(--brand-d)}
.qty.sm{padding:2px 4px;gap:6px}.qty.sm button{width:22px;height:22px;font-size:13px}
.cv-top{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.back2{border:0;background:#f3f4f6;width:34px;height:34px;border-radius:50%;font-size:16px}
.cv-top span{width:34px}
.cl{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f3}
.cl small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.cl-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:600}
.lnk{border:0;background:none;color:var(--brand-d);font-weight:700;padding:10px 0;font-size:13px}
.seg2{display:flex;background:#f3f4f6;border-radius:10px;padding:4px;gap:4px}
.seg2 button{flex:1;border:0;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:12.5px}
.seg2 button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cup-ok{background:var(--ok-l);color:var(--ok);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:13px}
.cup-ok .lnk{margin-left:auto;color:var(--ok);padding:4px 0}
.cup-err{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:6px}
.resumo{background:#f7f8fa;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:13px}
.resumo>div{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.resumo .tot{font-weight:800;font-size:15px;border-top:1px dashed #d8dbe0;margin-top:6px;padding-top:8px}
.cbk{color:#8a5a00;font-size:12px;margin-top:4px}
.qr{display:inline-block;padding:12px;border:1px solid var(--line);border-radius:14px;margin:10px 0}
.pix-code{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;background:#f3f4f6;border-radius:8px;padding:8px;word-break:break-all;text-align:left;color:#555}
.sm2{font-size:12px;margin-top:10px}
.ac-eta{background:var(--brand-l);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ac-eta small{display:block;color:var(--muted)}
.ac-eta b{font-size:20px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-i i{width:16px;height:16px;border-radius:50%;background:#e3e5e9;flex-shrink:0;margin-top:2px;position:relative;z-index:1}
.tl-i:not(:last-child):before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:#e3e5e9}
.tl-i.done i,.tl-i.cur i{background:var(--ok)}
.tl-i.done:before{background:var(--ok)!important}
.tl-i.cur i{box-shadow:0 0 0 5px #16a34a2e}
.tl-i b{display:block;font-size:13.5px}
.tl-i small{color:var(--muted);font-size:12px}
.tl-i:not(.done):not(.cur){opacity:.5}
/* whatsapp */
.wa-h{background:var(--wa);color:#fff;padding:22px 12px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.wa-h small{display:block;opacity:.8;font-size:11.5px}
.wa-av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;flex-shrink:0;color:var(--ink);font-weight:700}
.wa-b{flex:1;overflow:auto;background:var(--wabg);padding:12px 10px;background-image:radial-gradient(#e0d5c7 1px,transparent 1px);background-size:14px 14px}
.msg{max-width:84%;width:fit-content;padding:6px 9px 17px;border-radius:9px;margin:5px 0;position:relative;font-size:13.3px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere;min-width:84px}
.msg.in{background:#fff;border-top-left-radius:2px}
.msg.out{background:#d9fdd3;margin-left:auto;border-top-right-radius:2px}
.msg .t{position:absolute;right:8px;bottom:3px;font-size:10px;color:#7a8a80}
.msg .tk{color:#53bdeb}
.msg .who{font-size:11px;font-weight:700;color:var(--brand-d);margin-bottom:2px}
.msg.typing{display:flex;gap:4px;padding:12px 14px;min-width:0}
.msg.typing i{width:7px;height:7px;border-radius:50%;background:#9aa5a0;animation:bl 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.2s}.msg.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.sys{text-align:center;margin:8px auto;background:#fff5c4;color:#5b5020;font-size:11.5px;border-radius:8px;padding:4px 10px;width:fit-content;max-width:90%}
.wa-pix{background:#f0f2f5;border-radius:8px;padding:8px;margin-bottom:6px}
.wa-pix code{display:block;font-size:10.5px;word-break:break-all;margin:4px 0;color:#555}
.wa-pix small{color:var(--wa);font-weight:700}
.wa-img{width:170px;height:120px;border-radius:8px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);display:grid;place-items:center;font-size:40px;text-align:center}
.wa-img span{display:block;font-size:11.5px;color:#2e7d32;font-weight:600}
.wa-q{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--wabg);scrollbar-width:none;flex-shrink:0}
.wa-q button{white-space:nowrap;border:1px solid #c8d9d1;background:#fff;border-radius:16px;padding:5px 11px;font-size:12px;color:var(--wa);font-weight:600}
.wa-in{display:flex;gap:8px;padding:8px 8px 16px;background:#f0f0f0;align-items:center;flex-shrink:0}
.wa-in input{flex:1;border:0;border-radius:20px;padding:10px 14px;outline:0;min-width:0}

 toast(q==='Agora'?`Enviando para ${sg.q} clientes 📣`:`Campanha agendada para ${q} ✅`);render()}
function novoCupom(){openModal(`<div class="row sb"><h2 class="m0">Novo cupom</h2><button class="x" onclick="closeModal()">✕</button></div>
 <label class="lb">Código</label><input class="inp" id="nc-c" placeholder="Ex.: SEXTOU" style="text-transform:uppercase">
 <label class="lb">Tipo</label><select class="inp" id="nc-t"><option value="pct">Desconto em %</option><option value="fixo">Desconto em R$</option><option value="frete">Frete grátis</option></select>
 <div class="grid g2" style="gap:10px"><div><label class="lb">Valor</label><input class="inp" id="nc-v" placeholder="10"></div><div><label class="lb">Pedido mínimo (R$)</label><input class="inp" id="nc-m" placeholder="0"></div></div>
 <label class="lb">Para quem</label><select class="inp" id="nc-r"><option>Todos os clientes</option><option>Clientes sumidos há 30+ dias</option><option>1º pedido no canal próprio</option><option>Aniversariantes do mês</option></select>
 <label class="tg mt"><span class="sw"><input type="checkbox" checked><span></span></span>Mostrar no cardápio</label>
 <button class="btn pri mt" style="width:100%" onclick="salvarCupom()">Criar cupom</button>`)}
function salvarCupom(){const cod=$('#nc-c').value.trim().toUpperCase();if(!cod)return toast('Digite o código');
 CUP.push({cod,tipo:$('#nc-t').value,val:parseFloat($('#nc-v').value.replace(',','.'))||0,min:parseFloat($('#nc-m').value.replace(',','.'))||0,regra:$('#nc-r').value,usos:0,conv:0,ativo:true});
 closeModal();toast(`Cupom ${cod} criado — já funciona no cardápio 🎟️`);render()}

/* ============ RELATÓRIOS ============ */
function vRel(){const per=S.relPer;const D={hoje:{fat:2480.6,ped:44},'7':{fat:17845.3,ped:316},'30':{fat:74210.9,ped:1318}}[per];
 const dias=[3120,2280,1900,2410,3980,4620,4210,3350,2190,2050,2560,4110,4870,4390],lab=['S','T','Q','Q','S','S','D','S','T','Q','Q','S','S','D'];
 const mx=Math.max(...dias),W=640,H=210,bw=W/dias.length;
 const bars=`<svg viewBox="0 0 ${W} ${H+24}" class="bars" style="width:100%;height:auto">${[.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${H-H*f*.9}" y2="${H-H*f*.9}" stroke="#eef0f3"/>`).join('')}${dias.map((v,i)=>{const h=v/mx*H*.9;return `<rect x="${i*bw+8}" y="${H-h}" width="${bw-16}" height="${h}" rx="5" fill="${v===mx?'#ff5a1f':'#ffc2a8'}"><title>${brl(v)}</title></rect><text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle">${lab[i]}</text>`}).join('')}</svg>`;
 const org=[['Cardápio digital',46,'#ff5a1f'],['WhatsApp (IA)',31,'#25d366'],['iFood',17,'#ea1d2c'],['Balcão',6,'#9ca3af']];
 const C=2*Math.PI*60;let acc=0;
 const donut=`<svg viewBox="0 0 160 160" width="150" height="150"><g transform="rotate(-90 80 80)">${org.map(([,v,c])=>{const l=C*v/100;const s=`<circle cx="80" cy="80" r="60" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}"/>`;acc+=l;return s}).join('')}</g><text x="80" y="78" text-anchor="middle" font-size="20" font-weight="800">${D.ped}</text><text x="80" y="96" text-anchor="middle" font-size="11" fill="#6b7280">pedidos</text></svg>`;
 const fun=[['Abriram o cardápio',4820],['Viram um produto',3110],['Colocaram na sacola',1402],['Fizeram o pedido',1023]];
 const vend={8:240,11:410,4:212,6:188,2:176,1:121,3:98,14:87,9:76};
 const top6=P.filter(p=>vend[p.id]).map(p=>({p,q:vend[p.id],f:vend[p.id]*p.preco,m:(p.preco-p.custo)/p.preco*100})).sort((a,b)=>b.f-a.f).slice(0,6);
 return cab('Relatórios','Quanto vendeu, de onde veio e o que dá mais lucro',`<div class="per">${[['hoje','Hoje'],['7','7 dias'],['30','30 dias']].map(([k,l])=>`<button class="btn sm ${per===k?'pri':''}" onclick="S.relPer='${k}';render()">${l}</button>`).join('')}</div>`)
 +`<div class="grid g4 mb">${kpi('Faturamento',brl(D.fat),'▲ 14% vs. período anterior')}${kpi('Pedidos',D.ped,'▲ 11%')}${kpi('Ticket médio',brl(D.fat/D.ped),'▲ 3%')}${kpi('Comissão que você não pagou',brl(D.fat*.23),'comparado a 23% de marketplace')}</div>
 <div class="card ia mb"><b>✨ Sugestão da IA</b><p>Terça e quarta vendem metade de sexta e sábado. 87 clientes só pedem no fim de semana — uma campanha de cashback em dobro na quarta para eles pode render cerca de R$ 600 a mais por semana.</p><button class="btn pri sm" onclick="S.mkSeg=2;go('marketing')">Criar essa campanha</button></div>
 <div class="grid g2x mb"><div class="card"><h3 class="h3">Vendas por dia (últimas 2 semanas)</h3>${bars}</div>
 <div class="card"><h3 class="h3">De onde vêm os pedidos</h3><div class="row g8 wrap" style="gap:18px">${donut}<div class="leg grow">${org.map(([n,v,c])=>`<div><i style="background:${c}"></i>${n}<b>${v}%</b></div>`).join('')}</div></div></div></div>
 <div class="grid g2 mb"><div class="card"><h3 class="h3">Funil do cardápio</h3><div class="fun">${fun.map(([n,v])=>`<div><span>${n}</span><i style="width:${v/fun[0][1]*100}%"></i><b>${v.toLocaleString('pt-BR')}</b></div>`).join('')}</div><div class="note">Conversão de ${(fun[3][1]/fun[0][1]*100).toFixed(1).replace('.',',')}% — 379 pessoas montaram a sacola e desistiram. O “recuperador” manda um lembrete no WhatsApp.</div></div>
 <div class="card"><h3 class="h3">Avaliações <span class="pill ok">⭐ 4,7</span></h3>
 <div class="fb"><b>⭐⭐⭐⭐⭐</b> “Smash perfeito e chegou quentinho.” <br><small>Gustavo • ontem</small></div>
 <div class="fb"><b>⭐⭐⭐</b> “Batata chegou meio murcha.” <br><small>Larissa • 2 dias • <span class="warn-t">Sugestão: trocar a embalagem da batata por uma com respiro</span></small></div>
 <div class="fb"><b>⭐⭐⭐⭐⭐</b> “Atendimento pelo WhatsApp super rápido!” <br><small>Diego • 3 dias</small></div></div></div>
 <div class="card"><h3 class="h3">Produtos que mais vendem (30 dias)</h3><div class="tw"><table class="tbl"><tr><th>Produto</th><th>Vendidos</th><th>Faturamento</th><th>Margem</th></tr>
 ${top6.map(x=>`<tr><td><b>${x.p.emoji} ${esc(x.p.nome)}</b></td><td>${x.q}</td><td>${brl(x.f)}</td><td><span class="pill ${x.m>=60?'ok':x.m>=50?'warn':'bad'}">${x.m.toFixed(0)}%</span></td></tr>`).join('')}</table></div></div>`}

render();
</script>
